[project]
name = "demo-platform"
version = "0.1.0"
description = "Backend MVP for Telegram AI neurocommenting SaaS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.3",
  "asyncpg>=0.29.0",
  "celery[redis]>=5.4.0",
  "cryptography>=43.0.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "bcrypt>=5.0.0",
  "pydantic-settings>=2.5.2",
  "pydantic>=2.9.2",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.12",
  "redis>=5.1.1",
  "sqlalchemy[asyncio]>=2.0.35",
  "structlog>=24.4.0",
  "telethon>=1.37.0",
  "uvicorn[standard]>=0.31.0",
  "pysocks>=1.7.1",
  "python-socks>=2.7.0",
  "opentele2>=1.1.6",
  "openpyxl>=3.1.5",
  "pypdf>=5.1.0",
  "python-docx>=1.1.2",
  "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20.0",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
